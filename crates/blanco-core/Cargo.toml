[package]
name = "blanco-core"
version = "0.1.0"
edition = "2024"
description = "Shared traits and types for Blanco SQL editor"

[dependencies]
# LSP dependencies
lsp-types = { workspace = true }

# Common dependencies
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

# SQL parsing
sqlparser = { workspace = true }

# Optional: enables typed classification of `sqlx::Error` into the shared
# `ConnectionLost` marker. Enabled by the sqlx-based driver crates only, so
# non-sqlx consumers of blanco-core don't pull sqlx in.
sqlx = { workspace = true, optional = true }

[features]
sqlx = ["dep:sqlx"]

[lints]
workspace = true
