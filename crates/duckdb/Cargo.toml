[package]
name = "blanco-duckdb"
version = "0.1.0"
edition = "2024"
description = "DuckDB database implementation for Blanco SQL editor"

[lib]
path = "src/duckdb_connection.rs"

[dependencies]
blanco-core = { path = "../blanco-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Bundled: there is no system libduckdb on Windows or Debian, and the self
# updater replaces only the executable, so a shared library would go stale.
# The tilde keeps patch releases without moving to another DuckDB release.
duckdb = { version = "~1.10506.0", features = ["bundled"] }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt"] }

# Not used by a build script. They give the crates libduckdb-sys's build
# script is compiled from the features the whole workspace turns on, so
# building one package (`cargo test -p database`) reuses the DuckDB build of
# a workspace build instead of compiling its C++ again. Keep this list in step
# with what `scripts/duckdb-build-inputs` reports.
[build-dependencies]
bitflags = { version = "2", features = ["serde", "std"] }
getrandom = { version = "0.2", features = ["std"] }
once_cell = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = "1"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
syn = { version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
