[package]
name = "blanco-clipboard"
version.workspace = true
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/clipboard.rs"

[dependencies]
anyhow = { workspace = true }
raw-window-handle = "0.6"
tracing = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# The same backend GPUI uses, so the window's `wl_display` can be shared.
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen"] }
wayland-client = "0.31.11"
x11rb = "0.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[lints]
workspace = true
