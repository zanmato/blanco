[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
blanco-core = { path = "../blanco-core" }
gpui = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-async-std", "sqlite", "postgres", "mysql"] }
russh = "0.45"
async-trait = "0.1"

# Database crates
postgres = { path = "../postgres" }
mysql = { path = "../mysql" }
sqlite = { path = "../sqlite" }

# Async and utilities
tokio = { version = "1.0", features = ["full", "net", "io-util"] }
async-std = { version = "1.0", features = ["attributes"] }
async-compat = "0.2"
anyhow = "1.0"

# Logging
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL parsing
url = "2.0"

# UUID for generating unique IDs
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"