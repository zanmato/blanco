[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
blanco-core = { path = "../blanco-core" }
gpui = { workspace = true }
sqlx = { workspace = true }
russh = "0.45"
async-trait = { workspace = true }

# Database crates
postgres = { path = "../postgres" }
mysql = { path = "../mysql" }
sqlite = { path = "../sqlite" }

# Async and utilities
tokio = { version = "1.0", features = ["full", "net", "io-util"] }
async-std = { workspace = true }
async-compat = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# URL parsing
url = { workspace = true }

# UUID for generating unique IDs
uuid = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
