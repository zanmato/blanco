_version: 2
# Messages the SQL Server driver writes around the server's errors. See the
# glossary at the top of crates/blanco/locales/app.yml.
mssql:
  invalid_url:
    en: "invalid MSSQL connection URL: %{error}"
    sv: "ogiltig anslutnings-URL för MSSQL: %{error}"
  invalid_scheme:
    en: "MSSQL connection URL must use mssql:// or sqlserver://, got '%{scheme}'"
    sv: "anslutnings-URL:en för MSSQL måste börja med mssql:// eller sqlserver://, fick '%{scheme}'"
  username_required:
    en: "username is required in MSSQL connection string"
    sv: "anslutningssträngen för MSSQL måste ange ett användarnamn"
  connect_address_failed:
    en: "Failed to connect to SQL Server at %{address}: %{error}"
    sv: "Det gick inte att ansluta till SQL Server på %{address}: %{error}"
  connect_failed:
    en: "Failed to connect to SQL Server: %{error}"
    sv: "Det gick inte att ansluta till SQL Server: %{error}"
  too_many_redirects:
    en: "SQL Server kept redirecting after %{attempts} attempts"
    sv: "SQL Server fortsatte att omdirigera efter %{attempts} försök"
  connection_test_failed:
    en: "MSSQL connection test failed: %{error}"
    sv: "Anslutningstestet mot MSSQL misslyckades: %{error}"
  connect_timed_out:
    en: "SQL Server connection timed out after %{seconds}s"
    sv: "Anslutningen till SQL Server överskred tidsgränsen efter %{seconds} s"
  connection_check_failed:
    en: "SQL Server connection check failed: %{error}"
    sv: "Kontrollen av anslutningen till SQL Server misslyckades: %{error}"
  query_error:
    en: "MSSQL query error: %{error}"
    sv: "Fel i frågan mot MSSQL: %{error}"
  describe_error:
    en: "MSSQL describe error: %{error}"
    sv: "MSSQL kunde inte beskriva frågan: %{error}"
  write_error:
    en: "MSSQL write error: %{error}"
    sv: "Fel vid skrivning i MSSQL: %{error}"
  begin_error:
    en: "MSSQL begin error: %{error}"
    sv: "Det gick inte att starta transaktionen i MSSQL: %{error}"
  operation_error:
    en: "MSSQL operation error: %{error}"
    sv: "Fel i åtgärden i MSSQL: %{error}"
  commit_error:
    en: "MSSQL commit error: %{error}"
    sv: "Det gick inte att genomföra transaktionen i MSSQL: %{error}"
  table_not_found:
    en: "Table '%{table}' not found"
    sv: "Tabellen '%{table}' hittades inte"
  modified_since_restart:
    en: "since the server last started"
    sv: "sedan servern senast startades"
