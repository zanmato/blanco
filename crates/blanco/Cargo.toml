[package]
name = "blanco"
version.workspace = true
edition = "2024"

[dependencies]
# Workspace dependencies
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }

# Local dependencies
gpui_tokio = { path = "../gpui_tokio" }
scripting = { path = "../scripting" }
app-database = { path = "../app-database" }
sql-parser = { path = "../sql-parser" }
transformers = { path = "../transformers" }
blanco_ui = { path = "../ui", package = "blanco-ui" }
blanco-core = { path = "../blanco-core" }
blanco-terminal = { path = "../terminal" }
database = { path = "../database" }


# Additional dependencies
smol = { workspace = true }
dirs = { workspace = true }
rust-embed = { workspace = true }
async-trait = { workspace = true }
lsp-types = { workspace = true }
ropey = { workspace = true }

# SQL parsing
tree-sitter = "0.26"
tree-sitter-sequel = "0.3.8"
tree-sitter-redis = { path = "../tree-sitter-redis" }
tree-sitter-javascript = "0.23.1"

# Embedded JavaScript engine for script tabs
sqruff-lib = "0.34.1"
sqruff-lib-dialects = "0.34.1"
sqruff-lib-core = "0.34.1"
ahash = "0.8"

# CSV import
csv = "1"
chardetng = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
deunicode = "1"

# Tokio runtime handle for sqlx-tokio bridging
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

# MCP server exposing tabs, connections and SQL execution to external agents
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = "0.5"
tokio-util = "0.7"
schemars = "1"

[features]
# Stages scenes for the website screenshots; see scripts/screenshots/capture.
screenshots = []

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
sqlite = { path = "../sqlite" }
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
