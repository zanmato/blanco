[package]
name = "blanco"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace dependencies
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
futures = { workspace = true }

# Local dependencies
gpui_tokio = { path = "../gpui_tokio" }
blanco_ui = { path = "../ui", package = "blanco-ui" }
blanco-core = { path = "../blanco-core" }
database = { path = "../database" }

# LLM client
llm = { version = "1.3.7", features = ["openai", "anthropic", "google"] }

# Additional dependencies
smol = { workspace = true }
dirs = { workspace = true }
rust-embed = { workspace = true }
async-trait = "0.1"
lsp-types = { workspace = true }
ropey = { workspace = true }

# SQL parsing
tree-sitter = "0.25.4"
tree-sitter-sequel = "0.3.8"
once_cell = "1.19.0"
sqruff-lib = "0.34.1"
sqruff-lib-dialects = "0.34.1"
sqruff-lib-core = "0.34.1"
ahash = "0.8"
tikv-jemallocator = { workspace = true }

# CSV import
csv = "1"
chardetng = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
deunicode = "1"

# Tokio runtime handle for sqlx-tokio bridging
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
