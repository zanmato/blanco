[package]
name = "blanco"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace dependencies
gpui = { workspace = true }
gpui-component = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }

# Local dependencies
gpui_tokio = { path = "../gpui_tokio" }
blanco_ui = { path = "../ui", package = "blanco-ui" }
blanco-core = { path = "../blanco-core" }
database = { path = "../database" }

# LLM client
llm = { version = "1.3.7", features = ["openai", "anthropic", "google"] }

# Additional dependencies
smol = { workspace = true }
dirs = { workspace = true }
rust-embed = { workspace = true }
async-trait = "0.1"
lsp-types = { workspace = true }
ropey = { workspace = true }

# Tree-sitter for SQL parsing
tree-sitter = "0.25.4"
tree-sitter-sequel = "0.3.8"
once_cell = "1.19.0"

# HTTP client for AI chat
futures = { workspace = true }
