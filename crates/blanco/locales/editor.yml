      sv: "Tabell"
    view:
      en: "View"
      sv: "Vy"
    materialized_view:
      en: "Materialized View"
      sv: "Materialiserad vy"
  script:
    query:
      en: "Run a statement and return its rows.\n\nReturns `{ columns, rows, rowsAffected, executionTimeMs }`, where each row is an object keyed by column name whose values are strings or `null`.\n\nBlocks until the database answers."
      sv: "Kör en sats och returnerar dess rader.\n\nReturnerar `{ columns, rows, rowsAffected, executionTimeMs }`, där varje rad är ett objekt med kolumnnamn som nycklar och strängar eller `null` som värden.\n\nVäntar tills databasen svarar."
    execute:
      en: "Run a statement and return the number of affected rows.\n\nUse this for INSERT/UPDATE/DELETE/DDL where the rows themselves don't matter."
      sv: "Kör en sats och returnerar antalet påverkade rader.\n\nAnvänd den för INSERT/UPDATE/DELETE/DDL när raderna i sig inte spelar någon roll."
    transaction:
      en: "Run an array of statements as one atomic unit.\n\nBackends with transactional DML roll the whole batch back on failure; those without (Redis, ClickHouse) report how many statements were applied before the error. Statements that cannot run inside a transaction (e.g. Postgres `DROP DATABASE`) belong in separate `db.execute` calls."
      sv: "Kör en array av satser som en atomär enhet.\n\nDatabaser med transaktionell DML rullar tillbaka hela omgången vid fel. De utan (Redis, ClickHouse) rapporterar hur många satser som kördes före felet. Satser som inte kan köras i en transaktion (t.ex. Postgres `DROP DATABASE`) hör hemma i egna `db.execute`-anrop."
    display:
      en: "Render a value in the results grid.\n\nA result from `db.query` keeps its original column types. Anything else is converted: an array of objects becomes rows and columns, an object becomes a single row, a scalar becomes a single cell."
      sv: "Visar ett värde i resultatrutnätet.\n\nEtt resultat från `db.query` behåller sina ursprungliga kolumntyper. Allt annat konverteras: en array av objekt blir rader och kolumner, ett objekt blir en enda rad och ett skalärt värde blir en enda cell."
    rows:
      en: "The returned rows, each an object keyed by column name. SQL NULL arrives as `null`; every other value is a string."
      sv: "De returnerade raderna, var och en ett objekt med kolumnnamn som nycklar. SQL NULL kommer som `null`, alla andra värden är strängar."
    columns:
      en: "Column names in order. Unlike the row objects this preserves duplicate column names."
      sv: "Kolumnnamnen i ordning. Till skillnad från radobjekten behålls dubbletter av kolumnnamn."
    rows_affected:
      en: "Rows affected by the statement, as reported by the driver."
      sv: "Rader som satsen påverkade, enligt drivrutinen."
    execution_time_ms:
      en: "Server-side execution time in milliseconds, when the driver reports one."
      sv: "Körtiden på servern i millisekunder, när drivrutinen rapporterar en."
    no_bind_parameters:
      en: "This connection has no bind parameters: pass the command fully formed and omit `params`."
      sv: "Den här anslutningen saknar bindningsparametrar. Skicka kommandot färdigt och utelämna `params`."
