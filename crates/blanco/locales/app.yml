_version: 2
# Each key holds every locale's text. Swedish UI uses sentence case, and the
# terms below throughout:
# connection anslutning, connect ansluta, disconnect koppla från,
# query fråga, run kör, stop stoppa, cancel avbryt, explain förklara,
# result resultat, table tabell, column kolumn, row rad, cell cell,
# view vy, index index, trigger trigger, routine rutin, function funktion,
# procedure procedur, sequence sekvens, type typ, schema schema,
# database databas, server server, primary key primärnyckel,
# foreign key främmande nyckel, constraint begränsning, default standardvärde,
# tab flik, sidebar sidopanel, editor redigerare, snippet kodsnutt,
# script skript, history historik, settings inställningar,
# dashboard instrumentpanel, panel panel, chart diagram, stat nyckeltal,
# time range tidsintervall, variable variabel, filter filter (verb filtrera),
# commit changes spara ändringar, rollback changes ångra ändringar,
# pending väntande, refresh uppdatera, reload läs in igen, copy kopiera,
# paste klistra in, delete ta bort, drop (a table) ta bort, truncate töm,
# rename byt namn, duplicate duplicera, export exportera, import importera,
# backup säkerhetskopia (verb säkerhetskopiera), restore återställ,
# process list processlista, structure struktur, notification avisering,
# workspace arbetsyta, file fil, folder mapp, read only skrivskyddad,
# environment miljö, timeout tidsgräns, font typsnitt, theme tema,
# terminal terminal, update (the app) uppdatera, release version.
# Keep NULL, SQL keywords, product and backend names as they are.
