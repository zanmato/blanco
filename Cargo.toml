[workspace]
resolver = "2"
members = [
    "crates/blanco",
    "crates/ui",
    "crates/blanco-core",
    "crates/postgres",
    "crates/sqlite",
    "crates/mysql",
    "crates/clickhouse",
    "crates/database",
    "crates/gpui_tokio",
    "crates/mssql",
    "crates/redis",
    "crates/tree-sitter-redis",
    "crates/scripting",
    "crates/app-database",
    "crates/sql-parser",
    "crates/transformers",
    "crates/terminal",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Core GPUI dependencies. gpui-component depends on the `gpui-pre` crates.io
# snapshots of GPUI, so these must resolve to the same packages or cargo builds
# two copies of gpui. Keep the version requirement in step with the one in
# gpui-component's workspace Cargo.toml.
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/zanmato/gpui-component", branch = "blanco", features = ["tree-sitter", "tree-sitter-javascript"] }

# LSP dependencies (needed by gpui-component)
lsp-types = { version = "0.97.0", features = ["proposed"] }

smallvec = "1"

# Common dependencies
anyhow = { version = "1", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
similar = { version = "2", features = ["inline", "unicode"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
hex = "0.4"

# Database dependencies
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "sqlite",
    "postgres",
    "mysql",
    "uuid",
    "chrono",
    "json",
    "bigdecimal",
] }
rust_decimal = "1.32"

# SQL parsing
sqlparser = "0.61"

tempfile = "3.8"
dirs = "5"

# Terminal emulation. The zed-industries fork adds a child signal mask and
# window-id plumbing the upstream crate lacks; the crate itself is Apache-2.0.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }

# Additional dependencies
env_logger = "0.11"
smol = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
url = "2.5"
futures = "0.3"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
    "metric_chars",
] }
tokio = { version = "1.0", features = ["full"] }
tikv-jemallocator = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
] }

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

# Footguns we want to catch
await_holding_lock = "deny"
inherent_to_string_shadow_display = "deny"
print_stdout = "warn"
print_stderr = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"

[profile.release]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
tree-sitter-sequel = { path = "crates/tree-sitter-sequel" }

# To develop against a local gpui-component clone next to this repository, uncomment:
# [patch."https://github.com/zanmato/gpui-component"]
# gpui-component = { path = "../gpui-component/crates/ui" }
# gpui-component-macros = { path = "../gpui-component/crates/macros" }
