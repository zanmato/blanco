[workspace]
resolver = "2"
members = [
    "crates/blanco",
    "crates/ui",
    "crates/blanco-core",
    "crates/postgres",
    "crates/sqlite",
    "crates/mysql",
    "crates/clickhouse",
    "crates/database",
    "crates/gpui_tokio",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Core GPUI dependencies
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/zanmato/gpui-component", branch = "blanco", features = [
    "tree-sitter-languages",
] }
gpui-component-macros = { git = "https://github.com/zanmato/gpui-component", branch = "blanco" }

# Additional dependencies for gpui-component compatibility
notify = "7.0.0"
raw-window-handle = "0.6.2"
rust-i18n = "3"
schemars = "1"
serde_repr = "0.1"
smallvec = "1"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }

# LSP dependencies (needed by gpui-component)
lsp-types = { version = "0.97.0", features = ["proposed"] }

# Common dependencies
anyhow = { version = "1", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "1.0"
regex = "1.10"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
hex = "0.4"

# Database dependencies
sqlx = { version = "0.8", features = [
    "runtime-async-std",
    "tls-native-tls",
    "sqlite",
    "postgres",
    "mysql",
    "uuid",
    "chrono",
    "json",
    "bigdecimal",
] }
rust_decimal = "1.32"

# SQL parsing
sqlparser = "0.61"

# HTTP client
http = "1.0"
tempfile = "3.8"
dirs = "5"

# Additional dependencies
env_logger = "0.11"
smol = "2"
async-compat = "0.2"
async-io = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
url = "2.5"
flate2 = "1.0"
tar = "0.4"
futures = "0.3"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
    "metric_chars",
] }
async-stream = "0.3"
tokio = { version = "1.0", features = ["full"] }
tikv-jemallocator = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
] }

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.release]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
tree-sitter-sequel = { path = "../tree-sitter-sql" }
