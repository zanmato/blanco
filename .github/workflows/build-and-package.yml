name: Build and Package

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_path: target/x86_64-unknown-linux-gnu/release
            asset_name: -linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_path: target/x86_64-pc-windows-msvc/release
            asset_name: -windows-x86_64.exe
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_path: target/aarch64-apple-darwin/release
            asset_name: -macos-arm64

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libfontconfig-dev \
          libwayland-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev \
          libxkbcommon-dev \
          libxcb1-dev \
          libssl-dev \
          libzstd-dev \
          libvulkan1 \
          libsqlite3-dev

    # The generated parser.c of both grammars is gitignored, so it is produced
    # here with the same CLI contributors use locally.
    - name: Generate tree-sitter parsers
      shell: bash
      run: |
        npm install -g tree-sitter-cli@0.24.7
        ./scripts/setup.sh

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Build binary
      env:
        SCCACHE_GHA_ENABLED: "true"
        RUSTC_WRAPPER: "sccache"
      run: |
        cargo build --release --target ${{ matrix.target }} --package blanco

    - name: Package binary
      shell: bash
      run: |
        mkdir -p dist
        cp "${{ matrix.bin_path }}/blanco${{ matrix.extension || '' }}" "dist/blanco${{ matrix.asset_name }}"

    - name: Package .app bundle
      if: runner.os == 'macOS'
      run: |
        APP_NAME="Blanco"
        APP_IDENTIFIER="se.zanmato.blanco"
        APP_VERSION="${GITHUB_REF#refs/tags/v}"
        YEAR="$(date +%Y)"
        APP_PATH="${APP_NAME}.app"
        BINARY="dist/blanco${{ matrix.asset_name }}"

        mkdir -p "${APP_PATH}/Contents/MacOS"
        mkdir -p "${APP_PATH}/Contents/Resources"

        cp "${BINARY}" "${APP_PATH}/Contents/MacOS/${APP_NAME}"
        chmod +x "${APP_PATH}/Contents/MacOS/${APP_NAME}"

        cp crates/blanco/resources/AppIcon.icns "${APP_PATH}/Contents/Resources/"

        sed -e "s|{{APP_NAME}}|${APP_NAME}|g" \
            -e "s|{{APP_IDENTIFIER}}|${APP_IDENTIFIER}|g" \
            -e "s|{{APP_VERSION}}|${APP_VERSION}|g" \
            -e "s|{{YEAR}}|${YEAR}|g" \
            crates/blanco/resources/Info.plist > "${APP_PATH}/Contents/Info.plist"

        tar -czf "dist/blanco${{ matrix.asset_name }}.tar.gz" "${APP_NAME}.app"
        rm "${BINARY}"

    - name: Package .deb
      if: runner.os == 'Linux'
      env:
        SCCACHE_GHA_ENABLED: "true"
        RUSTC_WRAPPER: "sccache"
      run: |
        ./scripts/package-deb

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: blanco-${{ matrix.target }}
        path: |
          dist/blanco*

    - name: Upload .deb artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: blanco-deb
        path: build/blanco_*.deb

  release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Extract changelog for current version
      id: changelog
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        CHANGELOG=$(awk -v ver="$VERSION" '
          /^## \[/ { in_section = 0 }
          $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
          in_section && /^## \[/ { exit }
          in_section { print }
        ' CHANGELOG.md)
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # The updater refuses any asset whose SHA-256 is not listed here, and once
    # update_manager.rs embeds a public key it also verifies the minisign
    # signature over the list (scripts/generate-update-key.sh creates the pair).
    - name: Write checksums
      run: |
        mkdir -p release
        cp artifacts/blanco-*/blanco* release/
        cd release
        sha256sum blanco* > SHA256SUMS
        cat SHA256SUMS

    # Installs with an embedded key reject an unsigned release, so a missing
    # secret fails the job then instead of publishing one.
    - name: Sign checksums
      env:
        MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        PUBLIC_KEY="$(grep -A1 'const UPDATE_PUBLIC_KEY' crates/blanco/src/update_manager.rs | sed -n 's/.*Some("\([^"]*\)").*/\1/p')"
        if [ -z "$MINISIGN_SECRET_KEY" ]; then
          if [ -n "$PUBLIC_KEY" ]; then
            echo "::error::update_manager.rs embeds a public key but MINISIGN_SECRET_KEY is not set"
            exit 1
          fi
          echo "::warning::MINISIGN_SECRET_KEY is not set, releasing without a signature"
          exit 0
        fi
        sudo apt-get update && sudo apt-get install -y minisign
        printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
        printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m release/SHA256SUMS -x release/SHA256SUMS.minisig
        rm -f minisign.key
        if [ -n "$PUBLIC_KEY" ]; then
          minisign -V -P "$PUBLIC_KEY" -m release/SHA256SUMS -x release/SHA256SUMS.minisig
        fi

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        body: ${{ steps.changelog.outputs.body }}
        files: |
          release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Releases created with GITHUB_TOKEN do not trigger other workflows, so the
  # site is published from here rather than on a release event.
  pages:
    name: Publish site
    needs: [release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
